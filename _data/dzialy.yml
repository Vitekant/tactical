# =====================================================================
# Mapa gałęzi i działów — JEDYNE źródło prawdy dla nawigacji.
# ---------------------------------------------------------------------
# Struktura: gałąź (branch) -> lista działów (sections).
#
#   sily-zbrojne      -> wg etapu służby
#   sluzby-mundurowe  -> wg formacji
#
# We wpisie (_artykuly/*.md) podaje się TYLKO listę działów, np.
#
#     sections: [w-trakcie, policja]
#
# Gałąź wylicza się automatycznie z tej mapy — nie trzeba jej podawać.
# Artykuł może należeć do kilku działów, także z RÓŻNYCH gałęzi; pojawi
# się wtedy na wszystkich odpowiadających stronach.
#
# Kolejność tutaj wyznacza kolejność w menu i na listach bocznych.
#
# Dodając dział: dopisz wpis w `sections` poniżej — strona listingu
# wygeneruje się sama (patrz _artykuly/README lub README.md).
#
# Pełną, czytelną listę identyfikatorów znajdziesz też w
# kategorie.json w katalogu głównym (generowana z tego pliku).
# =====================================================================

- id: sily-zbrojne
  label: "Siły zbrojne"
  # Nagłówek bocznej listy działów na stronach tej gałęzi
  aside_label: "Działy"
  # `page` = nazwa pliku w dzialy/ (bez rozszerzenia). Trzymamy ją osobno od
  # `id`, bo adresy stron pochodzą sprzed migracji i nie wolno ich zmieniać.
  page: sily-zbrojne
  intro: "Prawa i obowiązki żołnierzy zawodowych na każdym etapie służby — od rekrutacji, przez przebieg kariery, po zaopatrzenie emerytalne."
  sections:
    - id: przed
      page: sily-zbrojne-przed
      label: "Przed rozpoczęciem służby"
      intro: "Rekrutacja, kwalifikacja wojskowa, wymogi formalne i zdrowotne oraz przebieg powołania do zawodowej służby wojskowej."
    - id: w-trakcie
      page: sily-zbrojne-w-trakcie
      label: "W trakcie służby"
      intro: "Przebieg służby żołnierza zawodowego: opinie służbowe, świadczenia, wypadki na służbie, odpowiedzialność dyscyplinarna."
    - id: po-zakonczeniu
      page: sily-zbrojne-po-zakonczeniu
      label: "Po zakończeniu służby"
      intro: "Zwolnienie ze służby, zaopatrzenie emerytalne żołnierzy, odprawy i świadczenia należne po odejściu z wojska."
    - id: karne-dyscyplinarne
      page: sily-zbrojne-karne-dyscyplinarne
      label: "Sprawy karne i dyscyplinarne"
      intro: "Sądownictwo wojskowe i postępowania dyscyplinarne żołnierzy zawodowych — przebieg spraw, prawa obwinionego i rola obrońcy."

- id: sluzby-mundurowe
  label: "Służby mundurowe"
  aside_label: "Formacje"
  page: sluzby-mundurowe
  intro: "Poradniki dla funkcjonariuszy służb mundurowych — z podziałem na formacje, z uwzględnieniem odrębnych pragmatyk służbowych."
  sections:
    - id: policja
      page: policja
      label: "Policja"
      intro: "Służba w Policji: nawiązanie i rozwiązanie stosunku służbowego, postępowania dyscyplinarne, opiniowanie, świadczenia."
    - id: straz-graniczna
      page: straz-graniczna
      label: "Straż Graniczna"
      intro: "Stosunek służbowy funkcjonariusza Straży Granicznej — powołanie, przebieg służby, zwolnienie i tryb odwoławczy."
    - id: sluzba-wiezienna
      page: sluzba-wiezienna
      label: "Służba Więzienna"
      intro: "Prawa i obowiązki funkcjonariuszy Służby Więziennej: pragmatyka służbowa, dyscyplinarki, świadczenia i zwolnienie ze służby."
    - id: skw-sww
      page: skw-sww
      label: "SKW i SWW"
      intro: "Służba w Służbie Kontrwywiadu Wojskowego i Służbie Wywiadu Wojskowego — specyfika stosunku służbowego i postępowań."
    - id: abw
      page: abw
      label: "ABW"
      intro: "Służba w Agencji Bezpieczeństwa Wewnętrznego: rekrutacja, awanse, opiniowanie, uposażenie oraz zaopatrzenie emerytalne."
    - id: inne
      page: inne-sluzby
      label: "Inne służby"
      intro: "Straż Miejska, SOP, Straż Ochrony Kolei, Państwowa Straż Pożarna, Służba Celno-Skarbowa i Służba Leśna — formacje o odrębnym statusie prawnym."
