# =====================================================================
# Publikacja zaplanowanych artykulow
# ---------------------------------------------------------------------
# Artykul z przyszla data (future: false w _config.yml) nie ma jeszcze
# swojej strony. Pojawi sie dopiero przy kolejnym budowaniu serwisu,
# a GitHub Pages buduje go normalnie tylko wtedy, gdy cos zostanie
# wypchniete. Ten workflow raz na dobe prosi Pages o przebudowe.
#
# Jak to robi: wysyla zadanie do API GitHuba
#     POST /repos/{owner}/{repo}/pages/builds
# Wedlug dokumentacji daje to "ten sam efekt co wypchniecie commita
# na galaz domyslna, ale nie wymaga dodatkowego commita" - historia
# repozytorium zostaje czysta, a ustawienia Pages bez zmian.
#
# Uwaga: NIE uzywamy actions/deploy-pages. Tamten sposob dziala tylko
# wtedy, gdy w ustawieniach repo zrodlem Pages jest "GitHub Actions".
# Tutaj zrodlem jest galaz main (tryb "legacy"), wiec wdrozeniem
# zajmuje sie wbudowany builder GitHuba.
#
# Reczne uruchomienie (gdy cos ma wejsc natychmiast):
#   Actions -> "Publikacja zaplanowanych artykulow" -> Run workflow
# =====================================================================
name: Publikacja zaplanowanych artykulow

on:
  schedule:
    # 05:10 UTC = 7:10 czasu polskiego latem, 6:10 zima.
    # Pelne godziny sa u GitHuba mocno obciazone i uruchomienie potrafi
    # sie opoznic, dlatego celujemy kilka minut po rownej godzinie.
    - cron: '10 5 * * *'
  workflow_dispatch:

# Do zadania przebudowy wystarczy wbudowany GITHUB_TOKEN z prawem
# zapisu do Pages. Zaden token osobisty nie jest potrzebny.
permissions:
  pages: write

jobs:
  przebuduj:
    runs-on: ubuntu-latest
    steps:
      - name: Popros GitHub Pages o przebudowe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kod=$(curl -sS -o odpowiedz.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")

          echo "Kod odpowiedzi: $kod"
          cat odpowiedz.json

          # 201 = zadanie przyjete i zakolejkowane.
          if [ "$kod" != "201" ]; then
            echo "::error::Nie udalo sie zlecic przebudowy (HTTP $kod)."
            exit 1
          fi
          echo "Przebudowa zakolejkowana."
